# v5b モデルを Google Drive から取得し、GitHub Releases（v5b）に置く（1 回だけ手動で実行）
name: upload-model
on: workflow_dispatch
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q gdown
      - run: gdown 1MYugrFHvdWlKnG1tsT-ylyZwo8fBL-kJ -O v5b_weights.pth
      - run: echo "1e432595dd2eb203ddfeddb8dac0ecb5a65b9496d5d3c095247795da9b062212  v5b_weights.pth" | sha256sum -c -
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v5b v5b_weights.pth --repo "$GITHUB_REPOSITORY" --title "v5b モデル" \
            --notes "古事類苑用に微調整した NDLOCR ver.2.1 レイアウト認識モデル（v4 ＋ 既存の識別タグ付きテキストから自動作成した学習データ 1,038 頁）。ノートブックが自動でダウンロードします。人部一 P1–100：割注 F 値 92.7、編目 F 値 68.8。SHA-256: 1e432595dd2eb203ddfeddb8dac0ecb5a65b9496d5d3c095247795da9b062212"
